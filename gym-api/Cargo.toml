[package]
name = "gym-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", 
"rustls", "chrono"] }
argon2 = "0.5"
jsonwebtoken = "9"
dotenvy = "0.15"