[package]
name = "gym-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", 
"rustls", "chrono"] }
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"
dotenvy = "0.15"
zxcvbn = "3.1.1"
totp-rs = { version = "5", features = ["qr", "gen_secret"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
serde_json = "1"
# Runs the API on Vercel (see serve_on_vercel in main.rs); unused when it runs on its own port
vercel_runtime = { version = "2.4", features = ["axum"] }
tower = { version = "0.5", features = ["util"] }
